---
- name: Create snapshot
  uri:
    url: "http://{{ es_master }}:9200/_snapshot/{{ snapshot_repository }}/{{ snapshot_name }}"
    method: PUT
    user: "{{ es.username }}"
    password: "{{ es.password }}"
    force_basic_auth: true
    body_format: json
    body:
      indices: "{{ snapshot_indices | default('*') }}"
      include_global_state: false
    status_code:
      - 200
      - 202

- debug:
    msg: "Snapshot {{ snapshot_name }} created."
