---
- name: Verify Elasticsearch cluster connection
  hosts: "{{ target_host | default('es') }}"
  become: true
  gather_facts: false

  vars:
    es_http_port: 9200
    es_transport_port: 9300

  tasks:

    - name: Check Elasticsearch service
      ansible.builtin.systemd:
        name: elasticsearch
      register: es_service
      changed_when: false

    - name: Verify Elasticsearch HTTP port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ es_http_port }}"
        timeout: 30
        state: started

    - name: Verify Elasticsearch transport port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ es_transport_port }}"
        timeout: 30
        state: started

    - name: Verify Elasticsearch cluster health
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:9200/_cluster/health"
        method: GET
        timeout: 10
        return_content: true
        status_code: 200
      register: cluster_health

    - name: Show cluster health
      ansible.builtin.debug:
        msg:
          service: "{{ es_service.status.ActiveState }}"
          cluster_status: "{{ cluster_health.json.status | default('unknown') }}"
          number_of_nodes: "{{ cluster_health.json.number_of_nodes | default(0) }}"

    - name: Fail when cluster connection is not recovered
      ansible.builtin.fail:
        msg: >-
          Elasticsearch cluster connection has NOT recovered on
          {{ inventory_hostname }}.
      when:
        - es_service.status.ActiveState != "active"
        - cluster_health.failed | default(true)
