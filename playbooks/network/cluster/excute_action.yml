---
- name: Execute Elasticsearch cluster connection remediation
  hosts: "{{ target_host | default('es') }}"
  become: true
  gather_facts: true

  tasks:

    - name: Restart Elasticsearch when service is down
      ansible.builtin.systemd:
        name: elasticsearch
        state: restarted
      when:
        - cluster_service_problem | default(false) | bool
      register: elasticsearch_restart

    - name: Wait for Elasticsearch HTTP port
      ansible.builtin.wait_for:
        port: 9200
        host: "{{ ansible_host | default(inventory_hostname) }}"
        state: started
        timeout: 60
      when:
        - elasticsearch_restart is defined
        - elasticsearch_restart.changed | default(false)

    - name: Restart network when cluster network is unavailable
      ansible.builtin.include_tasks:
        file: "/u01/ansible/eda/playbooks/network/restart_network.yml"
      when:
        - cluster_network_problem | default(false) | bool
        - not (cluster_service_problem | default(false) | bool)

    - name: Wait after network remediation
      ansible.builtin.pause:
        seconds: 10
      when:
        - cluster_network_problem | default(false) | bool

    - name: Show action result
      ansible.builtin.debug:
        msg:
          elasticsearch_restarted: >-
            {{
              elasticsearch_restart.changed
              if elasticsearch_restart is defined
              else false
            }}
          network_restart_requested: >-
            {{
              cluster_network_problem | default(false) | bool
            }}
